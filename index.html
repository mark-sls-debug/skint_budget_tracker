<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>SKINT — From Skint to Mint</title>
  <meta name="description" content="A simple mobile-first money tracker from SKINT. Know your number.">
  <link rel="icon" href="skint-logo.png">
  <style>
*{box-sizing:border-box}
:root{--bg:#000;--text:#fff;--muted:#a7a7a7;--line:#333;--card:#0b0b0b;--soft:#151515}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
button,input,select{font:inherit}
.app-shell{width:min(100%,560px);margin:0 auto;padding:18px 0 30px}
.brand{text-align:center;padding:4px 0 10px}.logo{width:155px;height:155px;object-fit:contain;display:block;margin:0 auto}.tagline{font-weight:900;letter-spacing:2px;font-size:12px;margin:-4px 0 12px}
.intro{text-align:center;padding:18px 4px 10px}h1{font-size:clamp(30px,8vw,46px);line-height:.98;margin:8px 0 18px;letter-spacing:-1.5px}.intro p{font-size:18px;line-height:1.45;margin:9px 0}.muted{color:var(--muted)}
.hidden{display:none!important}.primary,.secondary{width:100%;min-height:58px;border-radius:14px;font-weight:900;letter-spacing:.5px;cursor:pointer}.primary{background:#fff;color:#000;border:2px solid #fff}.secondary{background:#000;color:#fff;border:2px solid #fff}.primary:active,.secondary:active,.choice:active{transform:scale(.99)}
.progress{height:5px;background:#222;border-radius:99px;overflow:hidden;margin:4px 0 14px}.progress div{height:100%;background:#fff;width:0;transition:width .2s ease}.step{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:#aaa;margin:0 0 8px}
.tracker h2{font-size:30px;margin:8px 0 5px}.tracker .question{font-size:21px;line-height:1.2;margin:0 0 18px;font-weight:800}.field{margin:0 0 18px}.field label{display:block;font-size:16px;font-weight:800;margin-bottom:7px}.field input{width:100%;height:58px;background:#000;color:#fff;border:2px solid #fff;border-radius:12px;padding:0 16px;font-size:22px;font-weight:700;outline:none}.field input:focus{box-shadow:0 0 0 3px #444}.hint{color:#999;font-size:13px;line-height:1.35;margin-top:7px}
.nav{display:flex;gap:10px;margin-top:22px}.nav .secondary{width:34%}.nav .primary{width:66%}
.page{text-align:left;padding-top:8px}.page .eyebrow{font-size:12px;letter-spacing:2px;font-weight:900;color:#aaa}.page h2{font-size:clamp(34px,9vw,52px);line-height:.98;letter-spacing:-2px;margin:6px 0 14px}.page .lead{font-size:18px;line-height:1.4;color:#ddd;margin:0 0 20px}.hero-number{text-align:center;border:2px solid #fff;border-radius:16px;padding:22px 14px;margin:16px 0}.hero-number .big{font-size:clamp(54px,15vw,86px);font-weight:900;letter-spacing:-4px;line-height:1}.hero-number .label{font-size:12px;letter-spacing:2px;color:#aaa;font-weight:900;margin-top:8px}
.rating{text-align:center;border:1px solid #444;border-radius:14px;padding:18px;margin:16px 0}.rating .score{font-size:48px;font-weight:900;line-height:1}.rating .title{font-size:18px;font-weight:900;margin-top:6px}.rating p{color:#aaa;font-size:14px;line-height:1.4;margin:8px 0 0}
.card{border:1px solid #444;border-radius:14px;padding:15px;background:#080808;margin:10px 0}.card strong{font-size:17px}.card .sub{display:block;color:#aaa;font-size:13px;line-height:1.4;margin-top:6px}.card .annual{display:block;margin-top:6px;font-weight:800}.section-title{font-size:13px;letter-spacing:1.8px;color:#aaa;font-weight:900;margin:24px 0 9px;text-transform:uppercase}
.analogy{border:2px solid #fff;border-radius:14px;padding:16px;margin:20px 0}.analogy strong{font-size:18px}.analogy p{font-size:15px;line-height:1.45;color:#ddd;margin:10px 0 0}
.action-row{display:flex;gap:10px;margin-top:20px}.action-row .secondary,.action-row .primary{width:50%}
.leak-card{border:1px solid #444;border-radius:14px;padding:15px;margin:11px 0;background:#080808}.leak-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.leak-name{font-size:17px;font-weight:900}.leak-amount{text-align:right;font-weight:900;white-space:nowrap}.leak-note{color:#aaa;font-size:13px;line-height:1.35;margin:6px 0 12px}.leak-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.leak-buttons button{min-height:44px;border:1px solid #555;border-radius:10px;background:#000;color:#fff;font-weight:900;font-size:12px}.leak-buttons button.selected{background:#fff;color:#000;border-color:#fff}.found-box{border:2px solid #fff;border-radius:15px;padding:18px;text-align:center;margin:20px 0;position:sticky;bottom:10px;background:#000}.found-box .small{font-size:12px;color:#aaa;text-transform:uppercase;letter-spacing:1.5px}.found-box .found{font-size:44px;font-weight:900;letter-spacing:-2px;margin:4px 0}.found-box .new{font-size:16px;font-weight:800}.note{font-size:12px;line-height:1.4;color:#777;margin-top:14px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.choice{background:#000;color:#fff;border:1px solid #555;border-radius:12px;padding:14px 10px;font-weight:900;min-height:52px}.choice.selected{background:#fff;color:#000;border-color:#fff}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.tab{background:#000;color:#fff;border:2px solid #555;border-radius:12px;min-height:52px;font-weight:900}.tab.selected{background:#fff;color:#000;border-color:#fff}.select-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.year-btn{flex:1 1 22%;min-width:70px;background:#000;color:#fff;border:1px solid #555;border-radius:10px;padding:12px 7px;font-weight:900}.year-btn.selected{background:#fff;color:#000;border-color:#fff}.big-result{text-align:center;border:2px solid #fff;border-radius:15px;padding:20px;margin:15px 0}.big-result .amount{font-size:46px;font-weight:900;letter-spacing:-2px}.big-result .caption{color:#aaa;font-size:13px;margin-top:5px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:9px}.compare .card{margin:0}.disclaimer{font-size:11px;line-height:1.4;color:#666;margin-top:14px}
footer{text-align:center;color:#777;font-size:12px;padding:28px 10px 0}footer .small{font-size:10px;color:#555}
@media (min-width:700px){body{padding:24px}.app-shell{padding-top:10px}}
</style>
</head>
<body>
  <main class="app-shell">
    <header class="brand">
      <img src="skint-logo.png" alt="SKINT logo" class="logo">
      <p class="tagline">FROM SKINT TO MINT</p>
    </header>

    <section class="intro" id="intro">
      <h1>Where the hell is your money going?</h1>
      <p>You work all month. You get paid. Then somehow it's gone.</p>
      <p class="muted">Let's work out exactly what you have left.</p>
      <button class="primary" id="startBtn">LET'S FIND OUT</button>
    </section>

    <section class="tracker hidden" id="tracker">
      <div class="progress"><div id="progressBar"></div></div>
      <p class="step" id="stepLabel"></p>

      <div id="stepContent"></div>

      <div class="nav">
        <button class="secondary hidden" id="backBtn">BACK</button>
        <button class="primary" id="nextBtn">NEXT</button>
      </div>
    </section>

    <section class="result page hidden" id="resultPage"></section>
    <section class="result page hidden" id="leaksPage"></section>
    <section class="result page hidden" id="futurePage"></section>

    <footer>
      <p>SKINT — From Skint to Mint.</p>
      <p class="small">Educational tool only. It doesn't provide personalised financial advice.</p>
    </footer>
  </main>

  <script>
const incomeFields=[
  ["Main salary","Your usual take-home pay. Check your payslip or bank account and use the amount that actually lands in your account."],
  ["Overtime","Only include it if you can reasonably rely on it. Use your real average if it varies."],
  ["Benefits / support","Only include money you actually receive each month."],
  ["Side income","Use what you actually bring in, not what you hope to earn."],
  ["Other income","Only include regular income you can reasonably rely on."],
  ["Partner income","If you share finances, enter the amount that actually contributes to the household each month."],
  ["Other","Anything else that regularly comes into the household." ]
];

const billFields=[
 ["Rent / Mortgage","Check your bank account and enter the actual monthly payment."],
 ["Council Tax","Check your latest council tax payment. Use the monthly amount you actually pay."],
 ["Gas / Electricity","Check your latest bills or banking app. Don't guess your monthly cost."],
 ["Water","Check your latest payment and enter what you actually pay."],
 ["Broadband","Check your bank statement for the actual monthly payment."],
 ["Mobile phone","Check your bank statement and enter the actual monthly payment."],
 ["Car finance","Enter the payment that actually leaves your account each month."],
 ["Car insurance","Check your actual monthly payment. If you pay annually, divide the annual premium by 12."],
 ["Home insurance","Check your actual monthly payment. If you pay annually, divide the annual premium by 12."],
 ["Life insurance","Check your policy payment or bank statement. Don't estimate it."],
 ["Pet insurance","Check what you actually pay each month."],
 ["White goods / appliance cover","Check your bank statement for appliance or white goods cover and enter the actual amount."],
 ["Other insurance","Add any other regular insurance payments you actually make."],
 ["Fuel / transport","Use your normal committed transport cost here. We'll look at flexible spending separately."],
 ["Credit cards / loans","Enter your required monthly payments. We'll deal with extra debt payments separately later."],
 ["Childcare / children","Enter regular childcare or child-related commitments."],
 ["Broadband / TV packages","If this is separate from broadband above, enter the actual monthly payment."],
 ["Other regular bills","Anything else you have to pay regularly." ]
];

const spendingFields=[
 ["Food / groceries","Go check your online banking app and add up your supermarket and grocery spending from last month. Don't guess."],
 ["Coffee & lunches","Go check your online banking app and add up each time you bought a coffee or paid for lunch on a work day. Don't guess."],
 ["Takeaways","Open your banking app and add up every takeaway order from last month. Use the actual number."],
 ["Eating out / pubs","Check your bank statement and add up restaurants, meals out and pub spending from last month. Include rounds."],
 ["Shopping","Check your banking app and add up your shopping and online purchases from last month. Don't forget the little ones."],
 ["Amazon / online orders","Check your Amazon and other online orders from last month and add up what you actually spent."],
 ["Subscriptions","Check your bank account and list every subscription you currently pay for. Add the actual monthly total."],
 ["Entertainment","Check your banking app for cinema, games, events, days out and other entertainment from last month."],
 ["Hair / beauty","Check what you actually spent on haircuts, beauty treatments, nails and similar spending last month."],
 ["Smoking / vaping","Check your actual spending from last month. Don't estimate it."],
 ["Hobbies","Check your bank statement and add up what you actually spent on hobbies last month."],
 ["Other spending","Look through your bank statement and find regular spending that isn't listed above. Don't leave it as a guess." ]
];

const steps=[
 {title:"MONEY COMING IN",question:"What money comes into your household each month?",fields:incomeFields,key:"income"},
 {title:"BILLS",question:"What are you committed to paying every month?",fields:billFields,key:"bills"},
 {title:"SPENDING",question:"Now let's look at what you actually choose to spend.",fields:spendingFields,key:"spending"}
];
let step=0;
const data={};
let leakChoices={};
let futureMode="save";
let futureYears=5;
let bufferTarget=1000;

const intro=document.getElementById("intro"),tracker=document.getElementById("tracker"),resultPage=document.getElementById("resultPage"),leaksPage=document.getElementById("leaksPage"),futurePage=document.getElementById("futurePage");
const stepContent=document.getElementById("stepContent"),stepLabel=document.getElementById("stepLabel"),progressBar=document.getElementById("progressBar"),backBtn=document.getElementById("backBtn"),nextBtn=document.getElementById("nextBtn");

function showOnly(el){[tracker,resultPage,leaksPage,futurePage].forEach(x=>x.classList.add("hidden"));el.classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"});}

document.getElementById("startBtn").addEventListener("click",()=>{intro.classList.add("hidden");showOnly(tracker);renderStep();});
backBtn.addEventListener("click",()=>{saveCurrent();if(step>0){step--;renderStep();}});
nextBtn.addEventListener("click",()=>{saveCurrent();if(step<steps.length-1){step++;renderStep();}else{showResult();}});

document.addEventListener("click",e=>{
 if(e.target.id==="restartBtn"){Object.keys(data).forEach(k=>delete data[k]);leakChoices={};step=0;intro.classList.remove("hidden");showOnly(tracker);tracker.classList.add("hidden");return;}
 if(e.target.id==="leaksNext"){showLeaks();return;}
 if(e.target.id==="futureBack"){showResult();return;}
 if(e.target.dataset.leak){leakChoices[e.target.dataset.leak]=e.target.dataset.action;renderLeaks();return;}
 if(e.target.dataset.mode){futureMode=e.target.dataset.mode;renderFuture();return;}
 if(e.target.dataset.years){futureYears=Number(e.target.dataset.years);renderFuture();return;}
 if(e.target.dataset.buffer){bufferTarget=Number(e.target.dataset.buffer);renderFuture();return;}
});

function renderStep(){
 const cur=steps[step];stepLabel.textContent=`Step ${step+1} of ${steps.length} · ${cur.title}`;progressBar.style.width=`${((step+1)/steps.length)*100}%`;stepContent.innerHTML=`<h2>${cur.title}</h2><p class="question">${cur.question}</p>`;
 cur.fields.forEach((f,i)=>{const key=`${cur.key}_${i}`,d=document.createElement("div");d.className="field";d.innerHTML=`<label for="${key}">${f[0]}</label><input id="${key}" inputmode="decimal" type="number" min="0" step="0.01" placeholder="£0.00" value="${data[key]??""}"><div class="hint">${f[1]}</div>`;stepContent.appendChild(d);});
 backBtn.classList.toggle("hidden",step===0);nextBtn.textContent=step===steps.length-1?"SHOW ME MY NUMBER":"NEXT";
 window.scrollTo({top:0,behavior:"smooth"});
}
function saveCurrent(){const cur=steps[step];cur.fields.forEach((_,i)=>{const input=document.getElementById(`${cur.key}_${i}`);data[`${cur.key}_${i}`]=input&&input.value!==""?Number(input.value):0;});}
function total(prefix,fields){return fields.reduce((sum,_,i)=>sum+Number(data[`${prefix}_${i}`]||0),0);}
function money(v){return new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP",maximumFractionDigits:2}).format(v);}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function calc(){const income=total("income",incomeFields),bills=total("bills",billFields),spending=total("spending",spendingFields),left=income-bills-spending;return{income,bills,spending,left};}
function rating(left,income){if(income<=0)return{score:0,title:"NO NUMBER YET",text:"Enter your real income and outgoings to see where you stand."};const r=left/income;if(r<0)return{score:0,title:"IN THE RED",text:"You're spending more than you're bringing in. Your first job is to close that gap."};if(r<.05)return{score:2,title:"TIGHT",text:"You've got very little room for unexpected costs. Let's see what we can find."};if(r<.10)return{score:4,title:"A BIT WOBBLY",text:"You've got some room, but a few bad surprises could wipe it out."};if(r<.15)return{score:6,title:"GETTING THERE",text:"You've got breathing room. Now let's see if we can make it bigger."};if(r<.20)return{score:8,title:"LOOKING GOOD",text:"You've got a useful buffer. The next step is deciding what you want it to do."};return{score:10,title:"IN CONTROL",text:"You've created a solid monthly buffer. Now you can decide what comes next."};}
function showResult(){const c=calc(),r=rating(c.left,c.income);showOnly(resultPage);resultPage.innerHTML=`<div class="eyebrow">YOUR NUMBER</div><h2>YOUR NUMBER</h2><div class="hero-number"><div class="big">${money(c.left)}</div><div class="label">MONTHLY BUFFER</div></div><div class="rating"><div class="score">${r.score}/10</div><div class="title">${r.title}</div><p>${r.text}</p></div><div class="card"><strong>Income</strong><span class="sub">What comes in each month</span><span class="annual">${money(c.income)}</span></div><div class="card"><strong>Bills</strong><span class="sub">What you're committed to</span><span class="annual">${money(c.bills)}</span></div><div class="card"><strong>Spending</strong><span class="sub">What you actually spend</span><span class="annual">${money(c.spending)}</span></div><div class="analogy"><strong>🍻 Can you afford the round?</strong><p>Your salary is like walking into the pub with £100. If you don't know what the drinks cost or how long you're staying, don't be surprised when you check your wallet and find £4 left.</p><p>A budget isn't about stopping yourself having a pint. It's knowing whether you can afford the fucking round.</p></div><div class="action-row"><button class="secondary" id="restartBtn">START AGAIN</button><button class="primary" id="leaksNext">NEXT</button></div>`;}

function leakItems(){return spendingFields.map((f,i)=>({key:`spending_${i}`,name:f[0],amount:Number(data[`spending_${i}`]||0)})).filter(x=>x.amount>0).sort((a,b)=>b.amount-a.amount);}
function choiceAmount(x){const a=leakChoices[x.key];return a==="cut"?x.amount:a==="half"?x.amount/2:0;}
function found(){return leakItems().reduce((s,x)=>s+choiceAmount(x),0);}
function showLeaks(){showOnly(leaksPage);renderLeaks();}
function renderLeaks(){
  const c=calc(),items=leakItems(),f=found(),newNumber=c.left+f;
  const status=newNumber<0?`You are still ${money(Math.abs(newNumber))} short each month.`:newNumber===0?`You have reached break-even. You are no longer going backwards each month.`:`You now have ${money(newNumber)} left each month.`;
  const firstGoal=newNumber<0?`Find another ${money(Math.abs(newNumber))} a month and get yourself back to £0.`:`Your next job is to protect this money by building a cash buffer.`;
  leaksPage.innerHTML=`<div class="eyebrow">NEXT STEP</div><h2>WHERE ARE THE LEAKS?</h2><p class="lead">Your starting number was <strong>${money(c.left)}</strong> a month. Now let's see what happens if you change some of your spending.</p><p class="lead">These aren't "bad" things to spend money on. They're simply the places where you have the most control.</p>${items.length?items.map(x=>`<div class="leak-card"><div class="leak-top"><div class="leak-name">${esc(x.name)}</div><div class="leak-amount">${money(x.amount)}<br><span style="font-size:12px;color:#aaa">per month</span></div></div><div class="leak-note">That's ${money(x.amount*12)} a year. What if you changed it?</div><div class="leak-buttons"><button data-leak="${x.key}" data-action="keep" class="${(leakChoices[x.key]||"keep")==="keep"?"selected":""}">KEEP IT</button><button data-leak="${x.key}" data-action="half" class="${leakChoices[x.key]==="half"?"selected":""}">HALVE IT</button><button data-leak="${x.key}" data-action="cut" class="${leakChoices[x.key]==="cut"?"selected":""}">CUT IT</button></div></div>`).join(""):"<div class='card'><strong>No spending entered yet.</strong><span class='sub'>Go back and enter some real numbers from your banking app so SKINT can show you the difference.</span></div>"}<div class="found-box"><div class="small">MONEY YOU COULD FIND</div><div class="found">+${money(f)}</div><div class="new">${status}</div></div><div class="card"><strong>${newNumber<0?'GET BACK TO £0':'PROTECT YOUR PROGRESS'}</strong><span class="sub">${firstGoal}</span></div><div class="action-row"><button class="secondary" id="futureBack">BACK</button><button class="primary" id="futureNext">NEXT</button></div>`;
  document.getElementById("futureNext").onclick=()=>{showFuture(newNumber);};
}

function futureValue(monthly,years,rate){const n=years*12,r=rate/12;return monthly*((Math.pow(1+r,n)-1)/r);}
function showFuture(newNumber){showOnly(futurePage);renderFuture(newNumber);}

function renderFuture(newNumberOverride){
  const c=calc(),f=found(),newNumber=(typeof newNumberOverride==='number'?newNumberOverride:c.left+f);
  const monthly=Math.max(0,newNumber);
  const saveRate=.03,investRate=.05;
  const monthsToBuffer=monthly>0?Math.ceil(bufferTarget/monthly):null;
  const totalSave=futureValue(monthly,futureYears,saveRate);
  const totalInvest=futureValue(monthly,futureYears,investRate);
  const contrib=monthly*futureYears*12;

  if(newNumber<0){
    futurePage.innerHTML=`<div class="eyebrow">YOUR NEW NUMBER</div><h2>GET OUT OF THE RED</h2><div class="hero-number"><div class="big">${money(newNumber)}</div><div class="label">MONTHLY BUFFER</div></div><p class="lead">You found <strong>${money(f)}</strong> a month, which improved your position from <strong>${money(c.left)}</strong> to <strong>${money(newNumber)}</strong>.</p><div class="card"><strong>You're not ready to save this money yet.</strong><span class="sub">You're still ${money(Math.abs(newNumber))} short every month. Find another ${money(Math.abs(newNumber))} of savings, reduce a bill, increase your income, or tackle the spending that is still putting you in the red.</span></div><div class="section-title">THE NEXT TARGET</div><div class="big-result"><div class="amount">£0</div><div class="caption">Get your monthly number back to zero. Then you can start building your emergency buffer.</div></div><div class="card"><strong>Don't skip this bit.</strong><span class="sub">Investing while your monthly finances are still negative can leave you relying on credit when the next unexpected bill arrives. Get stable first.</span></div><div class="action-row"><button class="secondary" id="futureBack">BACK</button><button class="primary" id="restartBtn">START AGAIN</button></div>`;
    return;
  }

  if(newNumber===0){
    futurePage.innerHTML=`<div class="eyebrow">YOUR NEW NUMBER</div><h2>YOU'RE AT BREAK-EVEN</h2><div class="hero-number"><div class="big">£0.00</div><div class="label">MONTHLY BUFFER</div></div><p class="lead">You found <strong>${money(f)}</strong> a month and moved from <strong>${money(c.left)}</strong> to <strong>£0</strong>.</p><div class="card"><strong>Next target: get into the green.</strong><span class="sub">You're no longer losing money each month, but you don't yet have spare cash to build an emergency buffer. Find the next £1, £10 or £100 and start creating breathing room.</span></div><div class="section-title">YOUR FIRST TARGET</div><div class="big-result"><div class="amount">£500</div><div class="caption">Your first emergency-buffer milestone once you have a positive monthly number.</div></div><div class="action-row"><button class="secondary" id="futureBack">BACK</button><button class="primary" id="restartBtn">START AGAIN</button></div>`;
    return;
  }

  futurePage.innerHTML=`<div class="eyebrow">YOUR NEW NUMBER</div><h2>WHAT COULD YOUR MONEY BECOME?</h2><div class="hero-number"><div class="big">${money(newNumber)}</div><div class="label">NEW MONTHLY BUFFER</div></div><p class="lead">You found <strong>${money(f)}</strong> a month and moved your monthly number from <strong>${money(c.left)}</strong> to <strong>${money(newNumber)}</strong>.</p><div class="section-title">FIRST, BUILD YOUR SAFETY NET</div><p class="lead">Now that you're in the green, you could save <strong>${money(newNumber)}</strong> a month until you've built an emergency buffer you're comfortable with.</p><div class="choice-grid">${[500,1000,2000,3000,5000].map(v=>`<button class="choice ${bufferTarget===v?"selected":""}" data-buffer="${v}">${money(v)}</button>`).join("")}</div><div class="big-result"><div class="amount">${monthsToBuffer===null?"—":monthsToBuffer}</div><div class="caption">months to reach ${money(bufferTarget)} at ${money(newNumber)}/month, before any interest</div></div><div class="card"><strong>Why do this first?</strong><span class="sub">A cash buffer can give you breathing room when an unexpected bill lands, so you're not automatically reaching for credit.</span></div><div class="section-title">THEN DECIDE WHAT COMES NEXT</div><div class="tabs"><button class="tab ${futureMode==='save'?"selected":""}" data-mode="save">KEEP SAVING</button><button class="tab ${futureMode==='invest'?"selected":""}" data-mode="invest">INVEST</button></div><p class="lead">How long would you like to see the money grow?</p><div class="select-row">${[1,5,10,20,30].map(y=>`<button class="year-btn ${futureYears===y?"selected":""}" data-years="${y}">${y} ${y===1?"year":"years"}</button>`).join("")}</div><div class="big-result"><div class="amount">${money(futureMode==='save'?totalSave:totalInvest)}</div><div class="caption">illustrative value after ${futureYears} ${futureYears===1?"year":"years"} if you add ${money(newNumber)} every month</div></div><div class="compare"><div class="card"><strong>You put in</strong><span class="annual">${money(contrib)}</span><span class="sub">Your own monthly contributions</span></div><div class="card"><strong>Illustrative growth</strong><span class="annual">${money(Math.max(0,(futureMode==='save'?totalSave:totalInvest)-contrib))}</span><span class="sub">Not guaranteed</span></div></div><p class="disclaimer">Illustration only. The saving example assumes 3% annual growth and the investment example assumes 5% annual growth, compounded monthly, with contributions made monthly. Actual rates, returns, fees, tax and inflation can change the outcome. Investment values can fall as well as rise. This is not personalised financial advice.</p><div class="action-row"><button class="secondary" id="futureBack">BACK</button><button class="primary" id="restartBtn">START AGAIN</button></div>`;
}
</script>
